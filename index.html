  </div>`;
}
function csv(){
  const id=statsScope(),m=id==='all'?null:db.matches.find(x=>x.id===id);
  const {rows}=compute(m?[m]:db.matches,m?ui.statsSet:'all');
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const head=['Number','Player','Roles','Sets played','Rallies on court','Points for (on court)','Points against (on court)',...PTS.map(x=>x[1]),'Total points',...ERRS.map(x=>x[1]),'Total errors','Plus/minus','Serves','Serves in','Won on serve','Best serve run','Passes rated','Pass average'];
  const lines=[head.map(q).join(',')].concat(rows.sort((a,b)=>byNum(P(a.id)||{},P(b.id)||{})).map(r=>[pnum(r.id),pname(r.id),roleStr(P(r.id)),r.sets,r.r,r.pf,r.pa,...PTS.map(([c])=>r.pts[c]||0),r.pt,...ERRS.map(([c])=>r.errs[c]||0),r.er,r.pt-r.er,r.serves,r.serves-srvErr(r),r.srvWon,r.bestRun,r.pc,r.pc?(r.ps/r.pc).toFixed(2):''].map(q).join(',')));
  const name=m?`stats-${m.date}-${m.opp.replace(/[^\w-]+/g,'_')}.csv`:'stats-season.csv';
  exportModal(name,lines.join('\n'),'text/csv','Stats spreadsheet');
}

/* ---------- modals ---------- */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';ui.lu=null}

/* lineup builder: drag-and-drop or tap-to-place */
function lineupModal(){
  const m=liveMatch();if(!m)return;
  let prev=m.sets.length?m.sets[m.sets.length-1].start:null,fromPrevSet=!!prev;
  if(!prev){const last=[...db.matches].filter(x=>x.id!==m.id&&x.sets.length).sort(byDate)[0];if(last)prev=last.sets[0].start}
  const ok=id=>{const p=P(id);return p&&p.active!==false?id:null};
  const lu={rot:Array(6).fill(null),libs:[null,null],roles:{},serving:true,autoLib:true,pick:null};
  if(prev){lu.rot=prev.rot.map(ok);(prev.liberos||[]).slice(0,2).forEach((id,i)=>lu.libs[i]=ok(id));lu.roles=Object.assign({},prev.roles||{});lu.autoLib=prev.autoLib!==false;lu.serving=fromPrevSet?!prev.serving:true}
  const seen=new Set();lu.rot=lu.rot.map(id=>id&&!seen.has(id)?(seen.add(id),id):null);lu.libs=lu.libs.map(id=>id&&!seen.has(id)?(seen.add(id),id):null);
  ui.lu=lu;openModal(luHtml());
}
function luRole(id){return ui.lu.roles[id]||mainRole(P(id))||'OH'}
function luHtml(){
  const m=liveMatch(),lu=ui.lu;
  const placed=new Set([...lu.rot,...lu.libs].filter(Boolean));
  const tok=(id,from,lib)=>`<div class="pl${lib?' libj':''}${lu.pick&&lu.pick.id===id?' picked':''}" data-drag data-id="${id}" data-from="${from}">
     ${jersey(pnum(id))}<span class="nm">${esc(pname(id))}</span>${lib?'':`<span class="rt" data-cyc title="Tap to change role">${esc(luRole(id))} ▾</span>`}</div>`;
  const slot=i=>`<div class="slot" data-slot="r${i}"><span class="sl">P${i+1}${i===0?' · SERVE':''}</span>${lu.rot[i]?tok(lu.rot[i],'r'+i,false):'<span class="ph">Drop a player</span>'}</div>`;
  const lslot=i=>`<div class="slot" data-slot="l${i}"><span class="sl">${i?'2ND LIBERO':'LIBERO'}</span>${lu.libs[i]?tok(lu.libs[i],'l'+i,true):'<span class="ph">Optional</span>'}</div>`;
  const pool=activePlayers().filter(p=>!placed.has(p.id));
  return `<h2>Set ${m.sets.length+1} lineup</h2>
    <p class="muted" style="margin:0">Drag players onto the court, or tap a player then tap a spot. Tap a role tag to change what that player plays this set. The net is at the top; P1 serves.</p>
    <div class="lu-court"><div class="net"><span>NET</span></div><div class="lu-floor">${COURT.map((i,n)=>(n===3?'<div class="attack" aria-hidden="true"></div>':'')+slot(i)).join('')}</div></div>
    <div class="lu-libs">${lslot(0)}${lslot(1)}</div>
    <span class="muted" style="font-size:13px;font-weight:600">Available players · drag back here to remove</span>
    <div class="pool" data-slot="pool">${pool.map(p=>`<div class="pl${lu.pick&&lu.pick.id===p.id?' picked':''}" data-drag data-id="${p.id}" data-from="pool">${jersey(pnum(p.id))}<span class="nm">${esc(p.name)}</span><span class="rs">${esc(p.roles.join('/'))}</span></div>`).join('')||'<span class="muted">Everyone is placed.</span>'}</div>
    <label class="check"><input type="checkbox" id="lu-serve" ${lu.serving?'checked':''}>We serve first</label>
    <label class="check"><input type="checkbox" id="lu-auto" ${lu.autoLib?'checked':''}>Libero replaces middles (MB) in the back row automatically</label>
    <p class="err-msg" id="lu-err" hidden></p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="luclear">Clear court</button><span style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="startset">Start set</button></div>`;
}
function luRender(){const ov=$('#modal'),y=ov.scrollTop;$('#sheet').innerHTML=luHtml();ov.scrollTop=y}
function luGet(k){const lu=ui.lu;return k==='pool'?null:k[0]==='r'?lu.rot[+k.slice(1)]:lu.libs[+k.slice(1)]}
function luSet(k,v){const lu=ui.lu;if(k==='pool')return;if(k[0]==='r')lu.rot[+k.slice(1)]=v;else lu.libs[+k.slice(1)]=v}
function luMove(id,from,to){const lu=ui.lu;lu.pick=null;if(from!==to){const prev=luGet(to);luSet(to,id);if(from!=='pool')luSet(from,prev||null)}luRender()}
let drag=null,ghost=null,overEl=null;
function dragEnd(){if(ghost){ghost.remove();ghost=null}if(overEl){overEl.classList.remove('over');overEl=null}drag=null}
$('#sheet').addEventListener('pointerdown',e=>{
  if(!ui.lu)return;const it=e.target.closest('[data-drag]');if(!it)return;
  drag={id:it.dataset.id,from:it.dataset.from,x:e.clientX,y:e.clientY,el:it,moving:false,cyc:!!e.target.closest('[data-cyc]')};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moving){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;drag.moving=true;
    ghost=drag.el.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=drag.el.offsetWidth+'px';document.body.appendChild(ghost);drag.el.classList.add('dragging')}
  e.preventDefault();
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  const t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest('[data-slot]');
  if(s!==overEl){if(overEl)overEl.classList.remove('over');overEl=s;if(s)s.classList.add('over')}
},{passive:false});
window.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;
  if(d.moving){const t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest('[data-slot]');dragEnd();if(s)luMove(d.id,d.from,s.dataset.slot);else luRender();return}
  dragEnd();
  const lu=ui.lu;if(!lu)return;
  if(d.cyc){const cur=luRole(d.id),i=COURT_ROLES.indexOf(cur);lu.roles[d.id]=COURT_ROLES[(i+1)%COURT_ROLES.length];luRender();return}
  if(lu.pick&&lu.pick.id===d.id){lu.pick=null;luRender();return}
  if(lu.pick&&d.from!=='pool'){luMove(lu.pick.id,lu.pick.from,d.from);return}
  if(lu.pick&&d.from==='pool'&&lu.pick.from!=='pool'){luMove(lu.pick.id,lu.pick.from,'pool');return}
  lu.pick={id:d.id,from:d.from};luRender();
});
window.addEventListener('pointercancel',()=>{if(drag){const was=drag.moving;dragEnd();if(was)luRender()}});
$('#sheet').addEventListener('click',e=>{
  if(!ui.lu||!ui.lu.pick||e.target.closest('[data-drag]'))return;
  const s=e.target.closest('[data-slot]');if(s)luMove(ui.lu.pick.id,ui.lu.pick.from,s.dataset.slot);
});

function exportModal(name,text,type,what){
  ui.exp={name,text,type};
  openModal(`<h2>${esc(what)}</h2>
  <p class="muted" style="margin:0">On iPad, “Save file” opens the share sheet: choose <b>Save to Files</b>, AirDrop or Mail. If nothing happens, copy the text below and paste it into a note or email.</p>
  <textarea id="exp-text" readonly>${esc(text)}</textarea>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Close</button><button class="btn" data-act="copyexp">Copy text</button><button class="btn primary" data-act="saveexp">Save file</button></div>`);
}
async function saveFile(name,text,type){
  const blob=new Blob([text],{type});
  try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('Saving is blocked here. Use Copy text instead.')}
}
function readImport(text){
  try{const d=JSON.parse(text);if(!d||!Array.isArray(d.players)||!Array.isArray(d.matches))throw 0;ui.pendingImport=migrate(d);closeModal();render()}
  catch(e){toast("That file isn't a Courtside backup.")}
}

/* ---------- actions ---------- */
const A={
  tab(d){ui.tab=d.t;ui.sel=null;ui.pid=null;render();window.scrollTo(0,0)},
  close(){closeModal()},
  newmatch(){
    const opp=$('#nm-opp').value.trim();if(!opp){toast('Enter the opponent name.');$('#nm-opp').focus();return}
    const bo=+$('#nm-bo').value;db.lastBo=bo;
    db.matches.push({id:uid(),created:Date.now(),date:$('#nm-date').value||today(),opp,bo,status:'live',sets:[],events:[],notes:[],live:null});
    save();render();lineupModal();
  },
  lineup(){lineupModal()},
  luclear(){ui.lu.rot=Array(6).fill(null);ui.lu.pick=null;luRender()},
  startset(){
    const m=liveMatch(),lu=ui.lu;const e=$('#lu-err');const fail=t=>{e.textContent=t;e.hidden=false};
    if(lu.rot.some(x=>!x))return fail('Place a player in all six court positions.');
    const liberos=lu.libs.filter(Boolean);
    const roles={};lu.rot.forEach(id=>roles[id]=luRole(id));
    const serving=lu.serving,autoLib=lu.autoLib,rot=lu.rot.slice();
    m.live={set:m.sets.length,us:0,them:0,rot,serving,liberos,libero:liberos[0]||null,liberoFor:null,autoLib,roles,subs:0,to:{us:0,them:0},
      start:{rot:rot.slice(),serving,liberos:liberos.slice(),roles:clone(roles),autoLib},pairs:{},hist:[]};
    applyLibero(m.live);save();closeModal();ui.tab='live';ui.sel=null;render();
  },
  sel(d){ui.sel=ui.sel===d.id?null:d.id;render()},
  desel(){ui.sel=null;render()},
  pt(d){record('pt',d.c,ui.sel)},
  err(d){record('err',d.c,ui.sel)},
  oe(){record('oe')},
  op(){record('op')},
  to(d){
    const m=liveMatch(),L=m.live;
    if(d.team==='us'&&L.to.us>=MAX_TO){toast('Both timeouts already used this set.');return}
    snap(m);L.to[d.team]++;
    m.events.push({set:L.set,k:'to',team:d.team,us:L.us,them:L.them,t:Date.now()});
    save();render();toast(`Timeout ${d.team==='us'?db.team+' ('+L.to.us+'/'+MAX_TO+')':m.opp+' ('+L.to.them+')'} at ${L.us}–${L.them}`);
  },
  undo(){
    const m=liveMatch();if(!m||!m.live)return;const L=m.live,h=L.hist.pop();if(!h)return;
    m.events.length=h.n;const hist=L.hist;m.live=Object.assign(h.L,{hist});normLive(m.live);ui.sel=null;save();render();toast(`Undone · ${m.live.us}–${m.live.them}`);
  },
  rot(d){const m=liveMatch(),L=m.live;snap(m);rotate(L,+d.d);applyLibero(L);save();render()},
  serve(){const m=liveMatch(),L=m.live;snap(m);L.serving=!L.serving;applyLibero(L);save();render()},
  autolib(){const m=liveMatch(),L=m.live;snap(m);L.autoLib=!L.autoLib;applyLibero(L);save();render()},
  sub(d){
    const m=liveMatch(),L=m.live,i=L.rot.indexOf(ui.sel);if(i<0)return;
    const out=L.rot[i];
    if(!subOK(L,out,d.id)){toast(L.pairs[out]?`#${pnum(out)} can only swap back with #${pnum(L.pairs[out])}`:`#${pnum(d.id)} can only go back in for #${pnum(L.pairs[d.id])}`);return}
    snap(m);L.rot[i]=d.id;L.subs++;L.pairs[out]=d.id;L.pairs[d.id]=out;
    if(!L.roles[d.id])L.roles[d.id]=L.roles[out]||mainRole(P(d.id));
    m.events.push({set:L.set,k:'sub',p:d.id,o:out,us:L.us,them:L.them,t:Date.now()});
    applyLibero(L);ui.sel=null;save();render();toast(`${plabel(d.id)} in for ${plabel(out)}`);
  },
  pass(d){
    const m=liveMatch(),L=m.live;if(!ui.sel)return;snap(m);
    m.events.push({set:L.set,k:'pass',p:ui.sel,v:+d.v,us:L.us,them:L.them,t:Date.now()});
    const who=ui.sel;ui.sel=null;save();render();toast(`Pass ${d.v} · ${plabel(who)}`);
  },
  note(d){
    const m=d.id?db.matches.find(x=>x.id===d.id):liveMatch();if(!m)return;ui.noteM=m.id;
    const L=m.live;
    openModal(`<h2>Add a note</h2><p class="muted" style="margin:0">${L?`Saved with set ${L.set+1} at ${L.us}–${L.them}.`:'Saved as an after-match note.'}</p>
      <textarea id="note-text" style="font:16px/1.45 var(--body);min-height:120px" placeholder="e.g. Jade hurt her ankle · their #9 hits cross-court"></textarea>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="savenote">Save note</button></div>`);
    setTimeout(()=>{const t=$('#note-text');t&&t.focus()},50);
  },
  savenote(){
    const m=db.matches.find(x=>x.id===ui.noteM),t=$('#note-text').value.trim();if(!m)return;if(!t){toast('Write something first.');return}
    const L=m.live;m.notes.push(L?{set:L.set,us:L.us,them:L.them,text:t,t:Date.now()}:{set:null,text:t,t:Date.now()});
    save();closeModal();render();toast('Note saved');
  },
  delnote(d){const m=db.matches.find(x=>x.id===d.id);if(!m)return;m.notes.splice(+d.i,1);save();render();toast('Note deleted')},
  libin(){const m=liveMatch(),L=m.live;snap(m);const was=L.autoLib;L.autoLib=false;L.liberoFor=ui.sel;ui.sel=null;save();render();toast(was?'Libero in · auto libero turned off':'Libero in')},
  libout(){const m=liveMatch(),L=m.live;snap(m);L.autoLib=false;L.liberoFor=null;ui.sel=null;save();render();toast('Libero out')},
  libswap(d){const m=liveMatch(),L=m.live;snap(m);L.libero=d.id;applyLibero(L);ui.sel=null;save();render();toast(`${plabel(d.id)} is now the libero${L.liberoFor?' on court':''}`)},
  endset(){
    const m=liveMatch(),L=m.live;
    m.sets.push({us:L.us,them:L.them,start:L.start});m.live=null;ui.sel=null;
    if(matchOver(m)){const {w,l}=setWins(m);m.status='done';save();ui.tab='stats';ui.statsMatch=m.id;ui.statsSet='all';ui.flowSet=null;render();toast(w>l?`Match won ${w}–${l}`:w<l?`Match lost ${w}–${l}`:`Match tied ${w}–${l}`)}
    else{save();render();lineupModal()}
  },
  endmatch(){
    const m=liveMatch();if(!m)return;
    if(m.live&&(m.live.us||m.live.them))m.sets.push({us:m.live.us,them:m.live.them,start:m.live.start});
    m.live=null;m.status='done';save();ui.tab='stats';ui.statsMatch=m.id;ui.statsSet='all';ui.flowSet=null;render();
  },
  gonew(){if(liveMatch())toast('Finish or end the current match first.');ui.tab='live';render()},
  mstats(d){ui.tab='stats';ui.statsMatch=d.id;ui.statsSet='all';ui.flowSet=null;render()},
  flowset(d){ui.flowSet=+d.i;render()},
  delmatch(d){db.matches=db.matches.filter(m=>m.id!==d.id);save();render();toast('Match deleted')},
  profile(d){ui.tab='team';ui.pid=d.id;ui.pscope='all';render();window.scrollTo(0,0)},
  back(){ui.pid=null;render();window.scrollTo(0,0)},
  color(d){db.color=d.c;save();render()},
  nrole(d){const i=ui.newRoles.indexOf(d.r);if(i<0)ui.newRoles.push(d.r);else ui.newRoles.splice(i,1);render()},
  prole(d){const p=P(ui.pid);const i=p.roles.indexOf(d.r);if(i<0)p.roles.push(d.r);else p.roles.splice(i,1);p.roles.sort((a,b)=>ROLES.findIndex(x=>x[0]===a)-ROLES.findIndex(x=>x[0]===b));save();render()},
  addplayer(){
    const name=$('#np-name').value.trim();if(!name){toast('Enter a player name.');$('#np-name').focus();return}
    const roles=ROLES.map(r=>r[0]).filter(r=>ui.newRoles.includes(r));
    db.players.push({id:uid(),num:$('#np-num').value.trim(),name,roles,active:true});save();render();toast(`${name} added`);
    const n=$('#np-num');n&&n.focus();
  },
  delplayer(d){
    const used=db.matches.some(m=>m.events.some(e=>e.p===d.id||e.o===d.id||(e.on&&e.on.includes(d.id)))||(m.live&&(m.live.rot.includes(d.id)||m.live.liberos.includes(d.id))));
    if(used){const p=P(d.id);p.active=false;toast(`${p.name} has recorded stats, so they were set to inactive instead.`)}
    else{db.players=db.players.filter(p=>p.id!==d.id);ui.pid=null}
    save();render();
  },
  sample(){
    const s=[[1,'Maya',['S']],[3,'Léa',['OH']],[5,'Jade',['MB']],[7,'Chloé',['OPP','OH']],[9,'Emma',['OH']],[11,'Zoé',['MB']],[2,'Rosalie',['L']],[4,'Florence',['OH','L']],[8,'Alice',['MB','OPP']],[12,'Camille',['S','OPP']]];
    s.forEach(([num,name,roles])=>db.players.push({id:uid(),num:String(num),name,roles,active:true}));save();render();toast('Sample roster loaded. Rename the players to match your team.');
  },
  export(){const d=new Date().toISOString().slice(0,10);exportModal(`courtside-backup-${d}.json`,JSON.stringify(db),'application/json','Backup file')},
  saveexp(){saveFile(ui.exp.name,ui.exp.text,ui.exp.type)},
  copyexp(){const t=$('#exp-text');const done=()=>toast('Copied');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Text selected. Use Copy from the menu.')})}catch(e){t.select();toast('Text selected. Use Copy from the menu.')}},
  pasteimp(){openModal(`<h2>Paste backup text</h2><textarea id="imp-text" placeholder="Paste the backup text here"></textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="readpaste">Check backup</button></div>`)},
  readpaste(){readImport($('#imp-text').value)},
  doimport(){db=ui.pendingImport;ui.pendingImport=null;save();render();toast('Backup imported')},
  cancelimp(){ui.pendingImport=null;render()},
  csv(){csv()},
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if('confirm' in b.dataset&&!b.classList.contains('armed')){
    b.classList.add('armed');const orig=b.innerHTML;b.innerHTML='Tap again to confirm';
    setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.innerHTML=orig}},3000);return;
  }
  const f=A[b.dataset.act];if(f)f(b.dataset,b);
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#view').addEventListener('pointermove',flowMove);
$('#view').addEventListener('pointerdown',flowMove);
$('#view').addEventListener('pointerleave',flowLeave,true);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pf){const p=P(t.dataset.id);if(!p)return;const f=t.dataset.pf;p[f]=f==='active'?t.checked:f==='name'?(t.value.trim()||p.name):t.value.trim();save();render();return}
  if(t.id==='team-name'){db.team=t.value.trim()||'My team';save();renderChrome();return}
  if(t.id==='st-match'){ui.statsMatch=t.value;ui.statsSet='all';ui.flowSet=null;render();return}
  if(t.id==='st-set'){ui.statsSet=t.value;render();return}
  if(t.id==='p-scope'){ui.pscope=t.value;render();return}
  if(t.id==='lu-serve'&&ui.lu){ui.lu.serving=t.checked;return}
  if(t.id==='lu-auto'&&ui.lu){ui.lu.autoLib=t.checked;return}
  if(t.id==='imp-file'&&t.files[0]){const r=new FileReader();r.onload=()=>readImport(r.result);r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if(e.key==='Enter'&&e.target.id==='np-name')A.addplayer()});

let lock=null;
async function wake(){
  const lm=liveMatch(),want=ui.tab==='live'&&lm&&lm.live&&document.visibilityState==='visible';
  try{if(want&&!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}
      else if(!want&&lock){await lock.release();lock=null}}catch(e){lock=null}
}
document.addEventListener('visibilitychange',wake);
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.documentElement.dataset.sw==='1')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

render();
})();
</script>
